name: visqol_builder

description: Build, test, and upload ViSQOL

inputs:
  platform:
    description: Host platform to build on
    required: true
  architecture:
    description: target architecture to build for
    required: true
  build-options:
      description: bazel build command options
      required: false
      default: ""
  python-versions:
    description: Python versions to build bindings for
    required: false
    default: |
      3.8
      3.9
      3.10
      3.11
      3.12
      3.13
      3.14

runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install numpy    # for TensorFlow
    - shell: bash
      run: |
        bazelisk test -c opt :all ${{inputs.build-options}}
    - shell: bash
      run: |
        mkdir -p action-product/model
        cp bazel-bin/visqol action-product/
        cp model/lattice_tcditugenmeetpackhref_ls2_nl60_lr12_bs2048_learn.005_ep2400_train1_7_raw.tflite action-product/model/
        cp model/libsvm_nu_svr_model.txt action-product/model/
        cp LICENSE action-product/
        cp README.md action-product/
    - shell: bash
      working-directory: action-product
      run: |
        smoke_test() {
          output=$(./visqol "$@")
          echo "$output"
          grep -q "MOS-LQO" <<< "$output"
        }
        smoke_test \
          --reference_file ../testdata/conformance_testdata_subset/guitar48_stereo.wav \
          --degraded_file ../testdata/conformance_testdata_subset/guitar48_stereo_64kbps_aac.wav
        smoke_test --use_speech_mode \
          --reference_file ../testdata/clean_speech/CA01_01.wav \
          --degraded_file ../testdata/clean_speech/transcoded_CA01_01.wav
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-versions }}
    - shell: bash
      env:
        PYTHON_VERSIONS: ${{ inputs.python-versions }}
      run: |
        find_python() {
          if [[ "${{inputs.platform}}" == "windows" ]]; then
            py -$1 -c 'import sys, pathlib; print(pathlib.Path(sys.executable).as_posix())'
          else
            command -v "python$1"
          fi
        }
        path_sep=":"
        if [[ "${{inputs.platform}}" == "windows" ]]; then
          path_sep=";"
        fi
        mkdir action-product/python
        cp bazel-bin/*_pb2.py action-product/python/
        for version in $PYTHON_VERSIONS; do
          python_bin=$(find_python "$version")
          echo "::group::Python $version ($python_bin)"
          "$python_bin" -m pip install --quiet numpy absl-py "protobuf<6"
          bazelisk build -c opt python:visqol_lib_py.so --repo_env=PYTHON_BIN_PATH="$python_bin" ${{inputs.build-options}}
          suffix=$("$python_bin" -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')
          cp bazel-bin/python/visqol_lib_py.so "action-product/python/visqol_lib_py$suffix"
          PYTHONPATH="action-product${path_sep}action-product/python" "$python_bin" -B python/visqol_lib_py_test.py
          echo "::endgroup::"
        done
    - uses: actions/upload-artifact@v6
      with:
        name: visqol-${{ inputs.platform }}-${{ inputs.architecture }}
        path: action-product        
        
    
